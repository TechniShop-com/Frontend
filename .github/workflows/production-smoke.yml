name: Production smoke tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      promote:
        description: 'Promote this tested main commit to prod'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      TECHNISHOP_URL: http://127.0.0.1:4173
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require Supabase configuration
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo 'Missing VITE_SUPABASE_URL secret'; exit 1; }
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY" || { echo 'Missing VITE_SUPABASE_PUBLISHABLE_KEY secret'; exit 1; }
      - name: Build this commit
        run: |
          npm ci
          npm run build
      - name: Install Playwright
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Run smoke tests against this build and Supabase
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/technishop-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat /tmp/technishop-preview.log; exit 1; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null || { cat /tmp/technishop-preview.log; exit 1; }
          python tests/production_smoke.py
  promote:
    needs: smoke
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.promote == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    concurrency:
      group: production-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PRODUCTION_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCTION_PROMOTION_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Push the tested main commit to production
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com --force
          git fetch --no-tags origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/prod:refs/remotes/origin/prod
          if [ "$(git rev-parse refs/remotes/origin/main)" != "$GITHUB_SHA" ]; then
            echo 'Main advanced after this run started; run the workflow again to promote it.'
            exit 1
          fi
          git merge-base --is-ancestor refs/remotes/origin/prod "$GITHUB_SHA" || {
            echo 'Production is not an ancestor of the tested commit; refusing a non-fast-forward update.'
            exit 1
          }
          git push origin "$GITHUB_SHA:refs/heads/prod"
